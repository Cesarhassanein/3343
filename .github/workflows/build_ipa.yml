name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build_ipa:
    name: Build iOS IPA (Ready for Sideloading / Signing)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package App into .ipa
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -9 Wadiq.ipa Payload
          cd ../../..
          echo "IPA Created successfully at build/ios/iphoneos/Wadiq.ipa"

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wadiq-v1.0.4.ipa
          path: build/ios/iphoneos/Wadiq.ipa
          retention-days: 14
